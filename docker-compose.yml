name: "blockchain"

# Resource limits are required for every service (R60, R64, R102). The values below
# are the defaults; services that need more (pgsql, php) override them.
x-resources-default: &resources-default
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M
        pids: 256
      reservations:
        cpus: "0.25"
        memory: 128M

networks:
  blockchain:
    name: blockchain

services:
  nginx:
    build:
      context: .
      dockerfile: nginx.dockerfile
    container_name: nginx_bc
    restart: always
    depends_on:
      pgsql:
        condition: service_healthy
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_PORT_SSL:-443}:443"
    env_file:
      - .env
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
    <<: *resources-default
    networks:
      - blockchain

  php:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: php_bc
    restart: always
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
      - ./docker-include.txt:/var/www/html/docker-include.txt:ro
    env_file:
      - .env
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - blockchain

  composer:
    build:
      context: .
      dockerfile: composer.dockerfile
    container_name: composer
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
    working_dir: /var/www/html/be
    env_file:
      - .env
    <<: *resources-default
    networks:
      - blockchain

  artisan:
    build:
      context: .
      dockerfile: php.dockerfile
    container_name: artisan
    env_file:
      - .env
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
    working_dir: /var/www/html/be
    entrypoint: ["php", "artisan"]
    depends_on:
      pgsql:
        condition: service_healthy
    <<: *resources-default
    networks:
      - blockchain

  test:
    build:
      context: .
      dockerfile: test.dockerfile
    profiles: ["test"]
    # No env_file on purpose. The container environment lands in $_SERVER, and
    # Dotenv reads $_SERVER before $_ENV, so an env_file would silently beat the
    # values in phpunit.xml and run the suite against pgsql_bc. The app still
    # reads the .env bind mount itself; phpunit.xml stays the single source of
    # truth for the test environment.
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
    working_dir: /var/www/html/be
    entrypoint: ["composer", "test"]
    <<: *resources-default
    networks:
      - blockchain

  lint:
    build:
      context: .
      dockerfile: test.dockerfile
    profiles: ["test"]
    volumes:
      - ./src/be:/var/www/html/be:delegated
      - ./.env:/var/www/html/be/.env:ro
    working_dir: /var/www/html/be
    entrypoint: ["vendor/bin/pint", "--test"]
    <<: *resources-default
    networks:
      - blockchain

  pgsql:
    build:
      context: .
      dockerfile: postgres.dockerfile
    container_name: pgsql_bc
    restart: always
    shm_size: 128mb
    ports:
      - "6432:5432"
    volumes:
      - ./db/postgres:/var/lib/postgresql/data:delegated
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE:-myapp}
      POSTGRES_USER: ${DB_USERNAME:-myapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      PGDATA: /var/lib/postgresql/data/pgdata
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
          pids: 512
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${DB_USERNAME:-myapp}", "-d", "${DB_DATABASE:-myapp}"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - blockchain

  redis:
    # Local build. No service may reference a registry image (R91).
    build:
      context: .
      dockerfile: redis.dockerfile
    container_name: redis
    restart: always
    command: redis-server --save 20 1 --loglevel warning
    ports:
      - "8002:6379"
    volumes:
      - ./db/redis:/data
    <<: *resources-default
    networks:
      - blockchain
